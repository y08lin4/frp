name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.71.0-zh.1)'
        required: true
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build web assets (frps)
        run: make build
        working-directory: web/frps

      - name: Build web assets (frpc)
        run: make build
        working-directory: web/frpc

      - name: Cross compile binaries
        run: make -f Makefile.cross-compiles

      - name: Package
        run: |
          VERSION="${{ inputs.tag }}"
          mkdir -p release/packages
          cd release
          # Group frpc_/frps_ binaries by target suffix (os_arch),
          # mirroring the official release layout: one archive per
          # platform containing both frps and frpc.
          for f in frpc_* frps_*; do
            [ -e "$f" ] || continue
            base="$f"
            [ "${f##*.}" = "exe" ] && base="${f%.*}"
            case "$base" in
              frpc_*) os_arch="${base#frpc_}" ;;
              frps_*) os_arch="${base#frps_}" ;;
            esac
            echo "$f -> $os_arch"
            echo "$os_arch" >> /tmp/os_archs.txt
          done
          for os_arch in $(sort -u /tmp/os_archs.txt); do
            pkg_dir="frp_${VERSION}_${os_arch}"
            mkdir -p "./packages/${pkg_dir}"
            cp "../LICENSE" "./packages/${pkg_dir}/"
            for bin in frpc frps; do
              src="${bin}_${os_arch}"
              [ "${os_arch#*windows*}" != "$os_arch" ] && src="${src}.exe"
              [ -e "$src" ] && cp "$src" "./packages/${pkg_dir}/"
            done
            case "$os_arch" in
              windows*) ext=".zip" ;;
              *) ext=".tar.gz" ;;
            esac
            pkg_name="frp_${VERSION}_${os_arch}${ext}"
            if [ "$ext" = ".zip" ]; then
              (cd ./packages && zip -q -r "../${pkg_name}" "${pkg_dir}")
            else
              tar -czf "../${pkg_name}" -C ./packages "${pkg_dir}"
            fi
          done
          sha256sum frp_${VERSION}_* > frp_sha256_checksums.txt
          ls -la

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: frp ${{ inputs.tag }}（中文社区版）
          body_path: .github/release-template.md
          prerelease: ${{ inputs.prerelease }}
          files: |
            release/frp_*
            release/frp_sha256_checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
